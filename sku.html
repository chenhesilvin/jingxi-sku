        (() => {
            // ⚠️ 请将下面的 URL 和 Key 替换为你自己的 Supabase 项目信息
            const SUPABASE_URL = 'https://dudcppazwqgkaeannrks.supabase.co';        // 例如 https://xxxxx.supabase.co
            const SUPABASE_KEY = 'sb_publishable_ATBiAKdFYwBwjshO68Agdw_GGXudq3f';           // sb_publishable_xxxx
            const BUCKET_NAME = 'sku-images';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let searchWorker = null;
            let allSkus = [];
            let currentNav = 'sku-list';
            let searchImageData = null;
            let skuImgFile = null;
            let editImgFile = null;
            let batchMode = false;

            let currentSearchKeyword = '';
            let searchMode = 'fuzzy';

            const SEARCH_HISTORY_KEY = 'sku_image_search_history';
            const MAX_HISTORY = 20;
            function getSearchHistory() { try { const raw = localStorage.getItem(SEARCH_HISTORY_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }
            function addSearchHistory(url) { if (!url || !url.trim()) return; const trimmed = url.trim(); let history = getSearchHistory(); history = history.filter(h => h.url !== trimmed); history.unshift({ url: trimmed, time: Date.now() }); if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY); try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history)); } catch (e) {} }
            function removeSearchHistory(url) { let history = getSearchHistory(); history = history.filter(h => h.url !== url); try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history)); } catch (e) {} }

                            const articleDisplay = sku.article_number ? `<div style="font-weight:800;color:#e67e22;">📌 货号: ${esc(sku.article_number)}</div>` : '';
                            const matchLabel = r.total >= 0.75 ? '🟢 高度相似' : r.total >= 0.45 ? '🟡 中度相似' : '⚪ 低度相似';
                            return `<div class="search-result ${cls.split(' ')[0]}" style="cursor:pointer;" data-sku-id="${sku.id}">
                                <img src="${sku.image_url || ''}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2272%22 height=%2272%22><rect fill=%22%23e5e7eb%22 width=%2272%22 height=%2272%22/></svg>'">
                                <div style="flex:1;min-width:0;">
                                    ${articleDisplay}
                                    <div style="font-weight:700;">${esc(sku.sku_code)} <span style="font-weight:400;color:#6b7280;">${esc(sku.name)}</span></div>
                                    <small style="color:#6b7280;">${esc(sku.category||'')} ${sku.category && sku.responsible ? '|' : ''} ${esc(sku.responsible||'')}</small>
                                    <div style="margin-top:2px;">
                                        <span style="font-size:0.7rem;color:#9ca3af;">结构:${Math.round(r.structSim*100)}%</span>
                                        <span style="font-size:0.7rem;color:#9ca3af;margin-left:6px;">颜色:${Math.round(r.colorSim*100)}%</span>
                                        <span style="font-size:0.7rem;color:#9ca3af;margin-left:6px;">形状:${Math.round(r.shapeSim*100)}%</span>
                                        <span style="font-size:0.68rem;margin-left:6px;">${matchLabel}</span>
                                    </div>
                                </div>
                                <div class="score-badge ${cls.split(' ')[1]}" style="font-size:0.85rem;">${totalPct}%</div>
                            </div>`;
                        }).join('');
                    }
                    urlResultsContainer.innerHTML = html;

                    const simSlider = document.getElementById('urlSimThreshold');
                    const simValue = document.getElementById('urlSimValue');
                    if (simSlider && simValue) {
                        simSlider.addEventListener('input', () => {
                            urlSimilarityThreshold = parseInt(simSlider.value) / 100;
                            simValue.textContent = Math.round(urlSimilarityThreshold * 100) + '%';
                            renderFilteredResults();
                        });
                    }
                    document.getElementById('btnResetFilter')?.addEventListener('click', () => {
                        urlSimilarityThreshold = 0; urlCategoryFilter = ''; renderFilteredResults();
                    });
                    document.querySelectorAll('#urlCatFilter .filter-btn').forEach(btn => {
                        btn.addEventListener('click', function() { urlCategoryFilter = this.dataset.category; renderFilteredResults(); });
                    });
                    urlResultsContainer.querySelectorAll('.search-result').forEach(card => {
                        card.addEventListener('click', () => {
                            const skuId = Number(card.dataset.skuId);
                            const sku = allSkus.find(s => s.id === skuId);
                            if (sku) {
                                currentSearchKeyword = sku.sku_code;
                                searchMode = 'exact';
                                activate('sku-list');
                                toast(`已定位到 SKU: ${sku.sku_code}`, 'success');
                            }
                        });
                    });
                }
            }

            // ========== 批量导入（增加hu_moments处理） ==========
            function renderCSVImport() {
                document.getElementById('contentBody').innerHTML = `
                <div class="card"><div class="card-header">📥 批量导入CSV (每批200条，重复自动跳过)</div>
                <div class="card-body">
                    <p style="font-size:0.85rem;margin-bottom:8px;">⚠️ 仅<strong>SKU编号</strong>必填，货号可选。图片列可填写网络URL，导入时会自动计算特征值。重复SKU编号将自动跳过。 <button class="btn btn-outline btn-sm" id="btnTmplCSV">📥 模板</button></p>
                    <div class="form-group"><label>📁 上传CSV</label><input type="file" id="csvFileInput" accept=".csv,.txt"></div>
                    <div class="form-group"><label>📋 粘贴数据</label><textarea id="csvTextArea" rows="5" placeholder="article_number,sku_code,name,category,color,size,price,responsible,image_url"></textarea></div>
                    <label style="display:flex;align-items:center;gap:8px;"><input type="checkbox" id="hasHeader" checked> 首行为标题</label>
                    <div id="batchPreviewContainer" style="display:none;">
                        <div style="max-height:180px;overflow:auto;"><table class="import-preview-table" id="previewTable"></table></div>
                        <div id="batchInfo" style="font-size:0.8rem;margin:5px 0;"></div>
                        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                        <div id="batchStatus"></div>
                    </div>
                    <button class="btn btn-primary" id="btnBatchImport" disabled>📥 开始导入</button>
                </div></div>`;
                const BATCH = 200;
                let parsed = [];
                const csvFile = document.getElementById('csvFileInput'), csvArea = document.getElementById('csvTextArea'), headerChk = document.getElementById('hasHeader');
                const previewDiv = document.getElementById('batchPreviewContainer'), previewTable = document.getElementById('previewTable'), infoDiv = document.getElementById('batchInfo');
                const bar = document.getElementById('progressBar'), fill = document.getElementById('progressFill'), statusDiv = document.getElementById('batchStatus'), importBtn = document.getElementById('btnBatchImport');
                const parseCSV = (text, header) => {
                    const lines = text.split(/\r?\n/).filter(l => l.trim());
                    if (!lines.length) return [];
                    const sep = lines[0].includes('\t') ? '\t' : ',';
                    const rows = lines.map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, '')));
                    let heads = [], start = 0;
                    if (header) { heads = rows[0].map(h => h.toLowerCase()); start = 1; }
                    else heads = ['article_number','sku_code','name','category','color','size','price','responsible','image_url'];
                    const mapField = h => {
                        h = h.toLowerCase();
                        if (/货号|article|product.code|商品编号/.test(h)) return 'articleNumber';
                        if (/sku|编号/.test(h)) return 'skuCode';
                        if (/名称|name/.test(h)) return 'name';
                        if (/类目|category/.test(h)) return 'category';
                        if (/颜色|color/.test(h)) return 'color';
                        if (/尺码|size/.test(h)) return 'size';
                        if (/价格|price/.test(h)) return 'price';
                        if (/负责人|responsible/.test(h)) return 'responsible';
                        if (/图片|image|url/.test(h)) return 'imageUrl';
                        return null;
                    };
                    const colMap = heads.map(mapField);
                    return rows.slice(start).map(row => {
                        const obj = { articleNumber:'', skuCode:'', name:'', category:'', color:'', size:'', price:'', responsible:'', imageUrl:'' };
                        colMap.forEach((f, i) => { if (f && i < row.length) obj[f] = row[i]; });
                        return obj;
                    }).filter(o => o.skuCode);
                };
                const updatePreview = () => {
                    const t = csvArea.value.trim();
                    if (!t) { previewDiv.style.display = 'none'; importBtn.disabled = true; return; }
                    parsed = parseCSV(t, headerChk.checked);
                    previewDiv.style.display = 'block';
                    if (!parsed.length) { previewTable.innerHTML = '<tr><td colspan="9">无有效SKU编号</td></tr>'; importBtn.disabled = true; infoDiv.textContent = ''; return; }
                    previewTable.innerHTML = `<thead><tr>${['货号','SKU编号*','名称','类目','颜色','尺码','价格','负责人','图片URL'].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${parsed.slice(0,30).map(r => `<tr>${['articleNumber','skuCode','name','category','color','size','price','responsible','imageUrl'].map(f=>`<td>${(r[f]||'').substring(0,20)}</td>`).join('')}</tr>`).join('')}${parsed.length>30?'<tr><td colspan="9">...仅显示前30条...</td></tr>':''}</tbody>`;
                    importBtn.disabled = false;
                    infoDiv.textContent = `共 ${parsed.length} 条有效数据，将自动分为 ${Math.ceil(parsed.length/BATCH)} 批导入`;
                };
                csvFile.addEventListener('change', async () => { if (csvFile.files[0]) { csvArea.value = await csvFile.files[0].text(); updatePreview(); } });
                csvArea.addEventListener('input', updatePreview);
                headerChk.addEventListener('change', updatePreview);
                importBtn.addEventListener('click', async () => {
                    if (!parsed.length) return;
                    if (!confirm(`即将导入 ${parsed.length} 条SKU，重复编号将跳过，确定？`)) return;
                    let ok=0, fail=0, skip=0;
                    bar.style.display='block'; fill.style.width='0%'; importBtn.disabled=true;
                    for (let i=0; i<Math.ceil(parsed.length/BATCH); i++) {
                        const chunk = parsed.slice(i*BATCH, (i+1)*BATCH);
                        statusDiv.textContent = `正在导入第 ${i+1}/${Math.ceil(parsed.length/BATCH)} 批...`;
                        const codes = chunk.map(d=>d.skuCode.trim());
                        const { data: existing } = await supabase.from('skus').select('sku_code').in('sku_code', codes);
                        const existingSet = new Set(existing ? existing.map(e=>e.sku_code) : []);
                        for (const d of chunk) {
                            try {
                                const code = d.skuCode.trim();
                                if (!code) { fail++; continue; }
                                if (existingSet.has(code)) { skip++; continue; }
                                let finalImageUrl = '', phash='0000000000000000', colorHistogram=new Array(12).fill(0), huMoments=[0,0,0,0,0,0,0];
                                const rawImage = d.imageUrl?.trim();
                                if (rawImage && (rawImage.startsWith('http') || rawImage.startsWith('data:'))) {
                                    try {
                                        const response = await fetch(rawImage);
                                        if (!response.ok) throw new Error('下载失败');
                                        const blob = await response.blob();
                                        const file = new File([blob], `import-${Date.now()}.jpg`, { type: blob.type||'image/jpeg' });
                                        finalImageUrl = await uploadImage(file);
                                        const img = await new Promise((resolve,reject) => {
                                            const img = new Image();
                                            img.onload = ()=> resolve(img);
                                            img.onerror = ()=> reject(new Error('解析失败'));
                                            img.src = URL.createObjectURL(blob);
                                        });
                                        phash = computeHashFromImg(img);
                                        colorHistogram = computeHistFromImg(img);
                                        huMoments = computeHuMoments(img);
                                    } catch(imgErr) { finalImageUrl = rawImage; }
                                } else if (rawImage) finalImageUrl = rawImage;
                                await supabase.from('skus').insert({
                                    article_number: d.articleNumber || '',
                                    sku_code: code,
                                    name: d.name || '',
                                    category: d.category || '',
                                    color: d.color || '',
                                    size: d.size || '',
                                    price: d.price || '',
                                    responsible: d.responsible || '',
                                    image_url: finalImageUrl,
                                    phash,
                                    color_histogram: colorHistogram,
                                    hu_moments: huMoments,
                                    created_at: new Date()
                                });
                                ok++;
                            } catch(e) { fail++; }
                            fill.style.width = `${Math.round((ok+fail+skip)/parsed.length*100)}%`;
                        }
                        if (i < Math.ceil(parsed.length/BATCH)-1) await new Promise(r=>setTimeout(r,200));
                    }
                    bar.style.display='none'; statusDiv.textContent=''; await refreshData();
                    toast(`导入完成：成功 ${ok}，跳过重复 ${skip}，失败 ${fail}`, ok?'success':'error');
                    activate('sku-list');
                });
                document.getElementById('btnTmplCSV').addEventListener('click', ()=>{
                    const csv = 'article_number,sku_code,name,category,color,size,price,responsible,image_url\n,SKU-001,,,,,,,\n';
                    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv'});
                    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sku_template.csv'; a.click();
                    toast('模板已下载','success');
                });
            }

            // ========== 批量更新图片URL（同步更新Hu矩） ==========
            function renderBatchUpdateURL() {
                document.getElementById('contentBody').innerHTML = `
                <div class="card"><div class="card-header">🔄 批量更新图片URL</div>
                <div class="card-body">
                    <p style="font-size:0.85rem;">sku_code 和 new_image_url，自动重新计算所有特征</p>
                    <div class="form-group"><label>📁 上传CSV</label><input type="file" id="urlCsvFileInput" accept=".csv,.txt"></div>
                    <div class="form-group"><label>📋 粘贴数据</label><textarea id="urlCsvTextArea" rows="5" placeholder="sku_code,new_image_url\nSKU-001,https://..."></textarea></div>
                    <label><input type="checkbox" id="urlHasHeader" checked> 首行标题</label>
                    <div id="urlBatchPreviewContainer" style="display:none;">
                        <table class="import-preview-table" id="urlPreviewTable"></table>
                        <div id="urlBatchInfo"></div>
                        <div class="progress-bar" id="urlProgressBar"><div class="progress-fill" id="urlProgressFill"></div></div>
                        <div id="urlBatchStatus"></div>
                    </div>
                    <button class="btn btn-primary" id="btnUrlBatchUpdate" disabled>🔄 开始更新</button>
                </div></div>`;
                let parsed = [];
                const csvFile = document.getElementById('urlCsvFileInput'), csvArea = document.getElementById('urlCsvTextArea'), headerChk = document.getElementById('urlHasHeader');
                const previewDiv = document.getElementById('urlBatchPreviewContainer'), previewTable = document.getElementById('urlPreviewTable'), infoDiv = document.getElementById('urlBatchInfo');
                const bar = document.getElementById('urlProgressBar'), fill = document.getElementById('urlProgressFill'), statusDiv = document.getElementById('urlBatchStatus'), updateBtn = document.getElementById('btnUrlBatchUpdate');
                const parseCSV = (text,header) => {
                    const lines = text.split(/\r?\n/).filter(l=>l.trim());
                    if(!lines.length) return [];
                    const sep = lines[0].includes('\t')?'\t':',';
                    const rows = lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
                    let heads=[], start=0;
                    if(header){ heads=rows[0].map(h=>h.toLowerCase()); start=1; } else heads=['sku_code','new_image_url'];
                    const mapField = h => { h=h.toLowerCase(); if(/sku|编号/.test(h)) return 'skuCode'; if(/new.*image|new.*url|图片|image|url/.test(h)) return 'imageUrl'; return null; };
                    const colMap = heads.map(mapField);
                    return rows.slice(start).map(row=>{ const obj={skuCode:'',imageUrl:''}; colMap.forEach((f,i)=>{if(f&&i<row.length)obj[f]=row[i];}); return obj; }).filter(o=>o.skuCode&&o.imageUrl);
                };
                const updatePreview = () => {
                    const t = csvArea.value.trim();
                    if(!t){ previewDiv.style.display='none'; updateBtn.disabled=true; return; }
                    parsed = parseCSV(t,headerChk.checked);
                    previewDiv.style.display='block';
                    if(!parsed.length){ previewTable.innerHTML='<tr><td colspan="2">无有效数据</td></tr>'; updateBtn.disabled=true; infoDiv.textContent=''; return; }
                    previewTable.innerHTML=`<thead><tr><th>SKU编号</th><th>新图片URL</th></tr></thead><tbody>${parsed.slice(0,20).map(r=>`<tr><td>${esc(r.skuCode)}</td><td>${esc(r.imageUrl)}</td></tr>`).join('')}</tbody>`;
                    updateBtn.disabled=false; infoDiv.textContent=`共 ${parsed.length} 条`;
                };
                csvFile.addEventListener('change', async ()=>{ if(csvFile.files[0]){ csvArea.value=await csvFile.files[0].text(); updatePreview(); } });
                csvArea.addEventListener('input',updatePreview); headerChk.addEventListener('change',updatePreview);
                updateBtn.addEventListener('click', async ()=>{
                    if(!parsed.length) return;
                    if(!confirm(`即将更新 ${parsed.length} 个SKU图片及特征，确定？`)) return;
                    let ok=0,fail=0; bar.style.display='block'; fill.style.width='0%'; updateBtn.disabled=true;
                    for(let i=0;i<parsed.length;i++){
                        const {skuCode,imageUrl}=parsed[i];
                        statusDiv.textContent=`${i+1}/${parsed.length} : ${skuCode}`;
                        try {
                            const response = await fetch(imageUrl);
                            if(!response.ok) throw new Error('下载失败');
                            const blob = await response.blob();
                            const file = new File([blob], `update-${Date.now()}.jpg`, {type: blob.type||'image/jpeg'});
                            const newUrl = await uploadImage(file);
                            const img = await new Promise((resolve,reject)=>{
                                const img = new Image(); img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('解析失败')); img.src=URL.createObjectURL(blob);
                            });
                            const phash = computeHashFromImg(img);
                            const colorHistogram = computeHistFromImg(img);
                            const huMoments = computeHuMoments(img);
                            await updateSKUByCode(skuCode, { image_url: newUrl, phash, color_histogram, hu_moments: huMoments });
                            ok++;
                        } catch(e){ fail++; }
                        fill.style.width = `${Math.round((i+1)/parsed.length*100)}%`;
                    }
                    bar.style.display='none'; statusDiv.textContent=''; toast(`更新完成：成功 ${ok}，失败 ${fail}`, ok?'success':'error');
                    await refreshData(); activate('sku-list');
                });
            }

            // ========== 其他模块（批量更新货号SKU、模板下载）保持不变 ==========
            // 此处略去 renderBatchUpdateArticleAndSKU 和 renderTemplateDownload，因它们与特征无关

            // 粘贴事件全局处理（已添加Hu矩传递）
            document.addEventListener('paste', async (e) => {
                if (currentNav === 'upload-search') {
                    const items = e.clipboardData?.items;
                    if (items) for (const it of items) if (it.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = it.getAsFile(); if(!file) continue;
                        const { img, dataUrl } = await loadFileToImg(file);
                        searchImageData = compressImg(img, 400);
                        const pv = document.getElementById('searchPreview'), clr = document.getElementById('clearPreview'), btnS = document.getElementById('btnSearchNow'), dz = document.getElementById('dropZone'), res = document.getElementById('searchResultsContainer');
                        if(pv && clr && btnS && dz && res) {
                            pv.src = searchImageData; pv.style.display='block'; clr.style.display='flex';
                            dz.querySelector('.drop-icon').style.display='none'; const dropText=dz.querySelector('.drop-text'); if(dropText) dropText.style.display='none';
                            btnS.disabled = false;
                            res.innerHTML = '<p>🔎 搜索中...</p>';
                            const searchImg = new Image();
                            searchImg.onload = () => {
                                const hu = computeHuMoments(searchImg);
                                searchWorker.postMessage({ type:'search', payload:{ queryHash: computeHashFromImg(searchImg), queryHistogram: computeHistFromImg(searchImg), queryHu: hu } });
                            };
                            searchImg.src = searchImageData;
                        }
                        return;
                    }
                }
                if (currentNav === 'url-search') {
                    const items = e.clipboardData?.items;
                    if (items) for (const it of items) if (it.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = it.getAsFile(); if(!file) continue;
                        const { img, dataUrl } = await loadFileToImg(file);
                        const compressed = compressImg(img, 400);
                        // 切换到上传模式
                        const uploadPanel = document.getElementById('uploadModePanel'), urlPanel = document.getElementById('urlModePanel');
                        const uploadTab = document.querySelector('.search-tab[data-tab="upload-mode"]'), urlTab = document.querySelector('.search-tab[data-tab="url-mode"]');
                        if(uploadPanel && urlPanel && uploadTab && urlTab) {
                            urlPanel.style.display='none'; uploadPanel.style.display='block';
                            uploadTab.classList.add('active'); urlTab.classList.remove('active');
                        }
                        const preview = document.getElementById('urlUploadPreview'), clearBtn = document.getElementById('urlClearPreview'), searchBtn = document.getElementById('btnUrlUploadSearch'), dropZone = document.getElementById('urlDropZone');
                        const previewContainer = document.getElementById('urlPreviewContainer'), resultsContainer = document.getElementById('urlResultsContainer');
                        if(preview && clearBtn && searchBtn && dropZone) {
                            const spans = dropZone.querySelectorAll('span'); spans.forEach(s=>{ if(!s.classList.contains('preview-img-inline')) s.style.display='none'; });
                            preview.src = compressed; preview.style.display='block'; clearBtn.style.display='flex'; searchBtn.disabled=false;
                            if(previewContainer) previewContainer.innerHTML = `<div style="display:inline-block;position:relative;"><img src="${compressed}" style="max-width:260px;max-height:240px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.1);border:3px solid var(--primary);"><br><small>✅ 正在搜索...</small></div>`;
                            if(resultsContainer) resultsContainer.innerHTML = '<p>🔎 正在比对特征...</p>';
                            const searchImg = new Image();
                            searchImg.onload = () => {
                                const hu = computeHuMoments(searchImg);
                                searchWorker.postMessage({ type:'search', payload:{ queryHash: computeHashFromImg(searchImg), queryHistogram: computeHistFromImg(searchImg), queryHu: hu } });
                            };
                            searchImg.src = compressed;
                        }
                        return;
                    }
                }
            });

            // 侧边栏
            document.getElementById('sidebarNav').addEventListener('click', e => {
                const nav = e.target.closest('.nav-item'), sub = e.target.closest('.nav-sub-item');
                if (sub) { activate(sub.dataset.nav); return; }
                if (nav && nav.dataset.nav) activate(nav.dataset.nav);
            });
            document.getElementById('sidebarToggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('collapsed');
                document.getElementById('sidebarToggle').textContent = document.getElementById('sidebar').classList.contains('collapsed') ? '▶' : '◀ 收起菜单';
            });

            // 启动
            (async () => {
                initWorker();
                await refreshData();
                activate('sku-list');
                console.log('✅ 系统就绪（Hu矩形状增强 + 16x16哈希 + 权重优化）');
            })();
        })();
    </script>
</body>
</html>
